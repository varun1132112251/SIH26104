[metadata]
name = sih26104-voice-cloning-detection
version = 0.1.0
author = SIH26104 Team
description = AI-Powered Real-Time Detection and Prevention of Voice Cloning Impersonation Attacks
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/yourorg/sih26104
project_urls =
    Bug Tracker = https://github.com/yourorg/sih26104/issues
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    License :: OSI Approved :: MIT License

[options]
packages = find:
python_requires = >=3.9
install_requires =
    fastapi>=0.104.0
    uvicorn>=0.24.0
    numpy>=1.24.0
    scipy>=1.11.0

[options.extras_require]
dev =
    pytest>=7.4.0
    pytest-asyncio>=0.21.0
    pytest-cov>=4.1.0
    black>=23.12.0
    flake8>=6.1.0
    mypy>=1.7.0
    sphinx>=7.0.0

ml =
    librosa>=0.10.0
    torch>=2.0.0
    torchaudio>=2.0.0
    scikit-learn>=1.3.0

[options.packages.find]
where = .
